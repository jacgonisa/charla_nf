name: CI Tests

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  schedule:
    # Run tests every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

# Cancel running workflows when new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Run module tests
  test-modules:
    name: Module Tests (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile:
          - docker
        nxf_version:
          - '24.10.5'
          - 'latest-stable'
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nxf_version }}

      - name: Install nf-test
        run: |
          wget -qO- https://code.askimed.com/install/nf-test | bash
          sudo mv nf-test /usr/local/bin/
          nf-test version

      - name: Cache nf-test work directory
        uses: actions/cache@v4
        with:
          path: .nf-test
          key: nf-test-${{ hashFiles('nf-test.config', 'modules/**/*.nf') }}
          restore-keys: |
            nf-test-

      - name: Run module tests
        run: |
          nf-test test \
            --profile ${{ matrix.profile }} \
            --verbose \
            modules/local/tests/*.nf.test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-modules-${{ matrix.profile }}-nxf-${{ matrix.nxf_version }}
          path: |
            .nf-test/
            .nextflow.log

  # Job 2: Run pipeline integration tests
  test-pipeline:
    name: Pipeline Integration Tests (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile:
          - docker
        test_profile:
          - test
        nxf_version:
          - '24.10.5'
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nxf_version }}

      - name: Install nf-test
        run: |
          wget -qO- https://code.askimed.com/install/nf-test | bash
          sudo mv nf-test /usr/local/bin/
          nf-test version

      - name: Cache nf-test work directory
        uses: actions/cache@v4
        with:
          path: .nf-test
          key: nf-test-pipeline-${{ hashFiles('nf-test.config', '**/*.nf') }}
          restore-keys: |
            nf-test-pipeline-

      - name: Run pipeline tests
        run: |
          nf-test test \
            --profile ${{ matrix.profile }},${{ matrix.test_profile }} \
            --verbose \
            tests/default.nf.test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pipeline-${{ matrix.profile }}-${{ matrix.test_profile }}-nxf-${{ matrix.nxf_version }}
          path: |
            .nf-test/
            .nextflow.log
            results/

  # Job 3: Lint checks
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit --version

      - name: Run pre-commit hooks
        run: pre-commit run --all-files || true

      - name: Nextflow lint
        run: |
          nextflow run main.nf --help || true

  # Job 4: Documentation check
  check-docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for broken links in README
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'

      - name: Verify test documentation is up to date
        run: |
          if [ ! -f "tests/README.md" ]; then
            echo "❌ tests/README.md is missing!"
            exit 1
          fi
          echo "✅ Test documentation exists"

  # Job 5: Container build check
  check-containers:
    name: Check Container Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if Dockerfile exists
        run: |
          if [ ! -f "Dockerfile" ]; then
            echo "⚠️ No Dockerfile found, skipping container check"
            exit 0
          fi

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: charla_nf:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 6: Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - test-modules
      - test-pipeline
      - lint
      - check-docs
      - check-containers
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Module tests: ${{ needs.test-modules.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pipeline tests: ${{ needs.test-pipeline.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint checks: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation: ${{ needs.check-docs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Containers: ${{ needs.check-containers.result }}" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.test-modules.result }}" == "failure" ]] || \
             [[ "${{ needs.test-pipeline.result }}" == "failure" ]]; then
            echo "❌ Some tests failed!"
            exit 1
          else
            echo "✅ All tests passed!"
          fi
